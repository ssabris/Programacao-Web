spring.application.name=lojinha

# --- Conexão com o MySQL ---
# createDatabaseIfNotExist=true cria o banco "lojinha" se ele ainda não existir
spring.datasource.url=jdbc:mysql://localhost:3306/lojinha?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=SUA_SENHA_AQUI

# --- JPA / Hibernate ---
# update: cria e atualiza as tabelas a partir das entidades, sem apagar os dados
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL gerado (bom para estudar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
